<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#ffd24a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#2e6bff"/>
      <stop offset="100%" stop-color="#0a4d8c"/>
    </linearGradient>
    <radialGradient id="ballGrad" cx="0.35" cy="0.35">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </radialGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="4" y="4" width="192" height="192" rx="38" fill="#0b1020"/>

  <!-- Soccer ball (top) -->
  <g transform="translate(100 64)">
    <circle r="32" fill="url(#ballGrad)" stroke="#0b1020" stroke-width="2"/>
    <!-- pentagon pattern -->
    <polygon points="0,-18 17,-6 11,14 -11,14 -17,-6" fill="#0b1020"/>
    <path d="M -32 0 L -18 -6 M 32 0 L 18 -6 M 0 32 L -11 14 M 0 32 L 11 14 M 0 -32 L 0 -18" stroke="#0b1020" stroke-width="2" fill="none"/>
  </g>

  <!-- 26 stylized -->
  <text x="50%" y="155" text-anchor="middle"
        font-family="'Heebo','Rubik',sans-serif"
        font-size="74"
        font-weight="900"
        fill="url(#goldGrad)"
        letter-spacing="-4">26</text>

  <!-- Tournament ring -->
  <circle cx="100" cy="100" r="92"
          fill="none"
          stroke="url(#goldGrad)"
          stroke-width="3"
          stroke-dasharray="6 4"
          opacity="0.6"/>
</svg>
