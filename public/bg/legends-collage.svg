    <rect class="tile-bg"   width="250" height="200"/>
    <rect class="tile-line" x="5" y="5" width="240" height="190" rx="6"/>
    <use href="#p-celebrate" x="20"  y="40" width="80" height="120" class="silhouette"/>
    <text class="jersey" x="230" y="65" text-anchor="end">10</text>
    <text class="surname" x="125" y="185" text-anchor="middle">MESSI</text>
    <text class="era" x="125" y="30" text-anchor="middle">🇦🇷 2003–</text>
  </g>
