<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Player silhouette path: kicking pose -->
    <symbol id="player" viewBox="0 0 100 160">
      <!-- head -->
      <circle cx="50" cy="22" r="11"/>
      <!-- torso -->
      <path d="M 38 32 Q 38 50 44 70 L 56 70 Q 62 50 62 32 Z"/>
      <!-- arms -->
      <path d="M 38 36 L 24 60 L 28 72 L 40 50 Z"/>
      <path d="M 62 36 L 80 50 L 78 64 L 60 50 Z"/>
      <!-- standing leg -->
      <path d="M 44 70 L 42 105 L 36 145 L 46 145 L 50 110 Z"/>
      <!-- kicking leg -->
      <path d="M 56 70 L 70 90 L 86 100 L 82 110 L 62 95 L 56 90 Z"/>
    </symbol>

    <!-- Soccer ball symbol -->
    <symbol id="ball" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="2"/>
      <polygon points="20,10 28,15 25,25 15,25 12,15" fill="currentColor"/>
      <path d="M 2 20 L 12 18 M 38 20 L 28 18 M 20 38 L 16 28 M 20 38 L 24 28 M 20 2 L 20 10" stroke="currentColor" stroke-width="1.2" fill="none"/>
    </symbol>
  </defs>

  <!-- transparent base — page background shows through -->
  <rect width="600" height="600" fill="transparent"/>

  <g fill="#ffffff" opacity="0.05">
    <!-- scattered players in different poses (rotations + scales) -->
    <use href="#player" x="20"  y="40"  width="80"  height="128" transform="rotate(-8 60 104)"/>
    <use href="#player" x="180" y="100" width="100" height="160" transform="rotate(12 230 180)"/>
    <use href="#player" x="380" y="20"  width="90"  height="144" transform="rotate(-4 425 92)"/>
    <use href="#player" x="490" y="160" width="70"  height="112" transform="rotate(20 525 216)"/>
    <use href="#player" x="60"  y="240" width="95"  height="152" transform="rotate(6 108 316)"/>
    <use href="#player" x="240" y="320" width="85"  height="136" transform="rotate(-15 283 388)"/>
    <use href="#player" x="420" y="340" width="100" height="160" transform="rotate(8 470 420)"/>
    <use href="#player" x="20"  y="460" width="80"  height="128" transform="rotate(-10 60 524)"/>
    <use href="#player" x="160" y="500" width="70"  height="112" transform="rotate(14 195 556)"/>
    <use href="#player" x="340" y="500" width="85"  height="136" transform="rotate(-6 383 568)"/>
    <use href="#player" x="500" y="460" width="80"  height="128" transform="rotate(18 540 524)"/>
  </g>

  <g color="#ffd24a" opacity="0.04">
    <use href="#ball" x="120" y="200" width="38" height="38"/>
    <use href="#ball" x="320" y="60"  width="44" height="44"/>
    <use href="#ball" x="440" y="280" width="34" height="34"/>
    <use href="#ball" x="180" y="420" width="40" height="40"/>
    <use href="#ball" x="540" y="80"  width="32" height="32"/>
  </g>
</svg>
