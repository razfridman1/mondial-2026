<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>מונדיאל 2026 — לוח משחקים ושידורים בישראל</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>" />
</head>
<body>
  <header class="header">
    <div class="header-top">
      <div class="brand">
        <span class="brand-logo">⚽</span>
        <div>
          <div class="brand-title">מונדיאל 2026</div>
          <div class="brand-sub">לוח משחקים · שידורים בישראל · קנדה · מקסיקו · ארה״ב</div>
        </div>
      </div>
      <div id="header-clock"></div>
    </div>
    <nav class="tabs">
      <button class="tab-btn on" data-tab="schedule">📋 לוח משחקים</button>
      <button class="tab-btn"    data-tab="broadcasts">📺 שידורים בישראל</button>
      <button class="tab-btn"    data-tab="bracket">🏆 שלב הנוקאאוט</button>
      <button class="tab-btn"    data-tab="ai">🤖 תובנות AI</button>
      <button class="tab-btn"    data-tab="admin">🛠️ ניהול שידורים</button>
    </nav>
  </header>

  <main class="container">
    <section id="pane-schedule"   class="tab-pane on" data-tab="schedule"></section>
    <section id="pane-broadcasts" class="tab-pane"    data-tab="broadcasts"></section>
    <section id="pane-bracket"    class="tab-pane"    data-tab="bracket"></section>
    <section id="pane-ai"         class="tab-pane"    data-tab="ai"></section>
    <section id="pane-admin"      class="tab-pane"    data-tab="admin"></section>
  </main>

  <footer style="text-align:center; padding:30px 16px; color:#6b7396; font-size:12px;">
    <div>מונדיאל 2026 · 11 ביוני – 19 ביולי · קנדה · מקסיקו · ארה״ב</div>
    <div>כל הזמנים בשעון ישראל (Asia/Jerusalem) · עדכון אוטומטי בזמן אמת</div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/broadcasts.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/ai-insights.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
